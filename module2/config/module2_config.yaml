# Module 2 Configuration - Visual / Image Forensics

models:
  sidtd_checkpoint: "models/sidtd_efficientnet_b3.pth"
  input_size: 300
  num_classes: 2
  class_names:
    - "BONA_FIDE"
    - "FORGED"
  tamper_threshold: 0.50

ai_gate:
  enabled: true
  model_path: null
  input_size: 224
  deterministic_order:
    - "passport"
    - "visa"
    - "national_id"
    - "driving_license"
    - "permit"

forensics:
  tamper_weight: 0.60
  guilloche_weight: 0.40
  scoring_policy_missing_ref: "REWEIGHT"

ela:
  quality: 90
  scale: 10

dct:
  block_size: 8

guilloche:
  reference_root: "config/references"
  similarity_threshold: 0.75
  embedding_dim: 128

runtime:
  device: "auto"
  max_workers: 4
  mixed_precision: false

logging:
  level: "INFO"
