# Module 2 Configuration - Visual / Image Forensics

models:
  model_name: "efficientnet_b3"  # "efficientnet_b3" or "resnet18"
  tamper_checkpoint: "models/efficientnet_b3_combined_tamper.pth"
  input_size: 300
  num_classes: 2
  class_names:
    - "BONA_FIDE"
    - "FORGED"
  tamper_threshold: 0.50

ai_gate:
  # AI generation check is done; disabled in runtime so case flows straight to forensics
  enabled: false
  model_path: null
  input_size: 224
  deterministic_order:
    - "passport"
    - "visa"
    - "national_id"
    - "driving_license"
    - "permit"

forensics:
  tamper_weight: 0.60
  guilloche_weight: 0.40
  scoring_policy_missing_ref: "REWEIGHT"

ela:
  quality: 90
  scale: 10

dct:
  block_size: 8

guilloche:
  model_name: "resnet18"
  checkpoint_path: "models/guilloche_siamese_resnet18.pth"
  reference_root: "config/references"
  similarity_threshold: 0.75
  embedding_dim: 128

runtime:
  device: "auto"
  max_workers: 4
  mixed_precision: false

logging:
  level: "INFO"
