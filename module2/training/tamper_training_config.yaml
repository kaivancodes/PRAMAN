# Splice/Tamper Training Configuration for Document Forgery & Splicing Detection
# Binary Classification: BONA_FIDE (0) vs FORGED (1)
# Datasets supported: CASIA v2.0, SIDTD (split_normal), MIDV-2020, Combined

model:
  name: "efficientnet_b3"  # 'efficientnet_b3' or 'resnet18'
  pretrained: false
  num_classes: 2
  dropout: 0.3
  class_names:
    - "BONA_FIDE"
    - "FORGED"

training:
  batch_size: 16
  epochs: 25
  learning_rate: 0.0003
  weight_decay: 0.0001
  patience: 5
  image_size: 300
  lr_scheduler: "cosine"  # 'cosine' or 'step'
  step_size: 7
  gamma: 0.1

preprocessing:
  enabled: true
  perspective_warp: true
  clahe: true
  min_doc_area_ratio: 0.20

data:
  dataset_type: "sidtd"  # 'casia2', 'sidtd', 'midv2020', or 'combined'
  dataset_root: "data"
  split_type: "split_normal"  # For SIDTD
  templates_dir: "templates"

  # Optional path for CASIA v2.0 directory structure
  casia_root: "data/CASIA2"

  # Optional path for MIDV-2020 dataset
  midv_root: "data/MIDV2020"

runtime:
  device: "auto"
  num_workers: 2
  mixed_precision: true
  seed: 42

output:
  checkpoint_dir: "models"
  checkpoint_filename: "sidtd_efficientnet_b3.pth"
  save_best_only: true
  save_optimizer: false
