model:
  name: "resnet18"
  pretrained: true
  embedding_dim: 128
  dropout: 0.20

training:
  batch_size: 32
  epochs: 30
  learning_rate: 0.0002
  weight_decay: 0.0001
  patience: 6
  image_size: 128
  margin: 0.30

preprocessing:
  pattern_crop_size: 256
  image_size: 128

data:
  dataset_root: "data"
  sidtd_root: "data"
  midv_root: "data/MIDV-2020"
  pairs_per_epoch: 2000

runtime:
  device: "auto"
  num_workers: 4
  mixed_precision: true
  seed: 42

output:
  checkpoint_dir: "models"
  checkpoint_filename: "guilloche_siamese_resnet18.pth"
  similarity_threshold: 0.75
